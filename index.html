<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Game Garden</title>
<style>
:root{--ink:#43275d;--pink:#ff6fae;--lav:#eadbff}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,sans-serif;background:linear-gradient(135deg,#fff1fa,#e6f9ff,#fff9d9);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{text-align:center;background:linear-gradient(120deg,#ffb4d5,#c8b2ff,#a7e8da),url('assets/maple-moon-town.png') center/cover;border:4px solid white;border-radius:30px;padding:28px;box-shadow:0 8px #d2bce5;overflow:hidden}.hero h1{font-size:clamp(2.4rem,7vw,5rem);margin:0;text-shadow:3px 3px white}.hero p{font-size:1.1rem}.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.badge{background:#ffffffbc;padding:7px 12px;border-radius:99px;font-weight:800}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.search{flex:1;min-width:220px;padding:13px;border:3px solid white;border-radius:15px;background:#ffffffc7;font-size:1rem}.filter,.primary,.play,.close,.choice{border:0;border-radius:14px;padding:11px 15px;font-weight:800;cursor:pointer;color:var(--ink);touch-action:manipulation}.filter{background:white}.filter.active,.primary{background:var(--pink);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:#fffdfd;border:3px solid white;border-radius:23px;padding:18px;box-shadow:0 5px 12px #6a4b7820;display:flex;flex-direction:column;min-height:235px}.card:hover{transform:translateY(-3px)}.emoji{display:none}.game-art{height:105px;border-radius:16px;background:url('assets/maple-moon-town.png') center 44%/cover;border:3px solid #f0d8ff}.tag{font-size:.75rem;text-transform:uppercase;font-weight:900;color:#8b579f}.card h3{margin:6px 0}.card p{line-height:1.4;margin:4px 0 14px}.play{margin-top:auto;background:var(--lav);width:100%}.panel{display:none;background:white;border:4px solid white;border-radius:26px;padding:24px;box-shadow:0 6px 16px #6a4b7827;margin-top:18px}.panel.show{display:block}.panel.fullscreen{position:fixed;z-index:5;inset:0;margin:0;border:0;border-radius:0;overflow:auto;padding:clamp(18px,5vw,60px);background:linear-gradient(135deg,#fff7fc,#f0eaff)}.panel.fullscreen #area{max-width:900px;margin:auto}.close{float:right;border-radius:50%;background:#f0e4f6;width:44px;height:44px;font-size:1.5rem}.choicegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.choice{background:#fff8fd;border:3px solid #eadcf3;text-align:left;min-height:54px}.choice:hover,.choice.selected{border-color:var(--pink);background:#fff0f7}.stage{background:linear-gradient(#bcecff 0 58%,#b9e7c4 58%);border-radius:20px;padding:24px;min-height:180px;text-align:center}.worldstage{position:relative;min-height:420px;overflow:hidden;background:linear-gradient(#bcecff 0 55%,#abd995 55%);border-radius:22px}.worldstage:before{content:'';position:absolute;inset:0;background:url('assets/maple-moon-town.png') center/cover;opacity:.9}.worldlabel{position:absolute;top:18px;left:18px;background:#ffffffdd;padding:10px 14px;border-radius:14px;font-weight:900}.avatar{position:absolute;z-index:2;bottom:28px;left:42%;width:125px;filter:drop-shadow(0 7px 4px #4d376044);transition:left .25s,transform .25s}.avatar.walk{transform:scaleX(-1)}.worldpad{display:grid;grid-template-columns:repeat(3,76px);justify-content:center;gap:8px;margin:14px}.worldpad button{height:58px;border:0;border-radius:16px;background:#f2e5ff;font-size:1rem;font-weight:900}.worldtabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.worldtabs button{border:0;border-radius:12px;padding:11px 14px;background:#f0e4ff;font-weight:900}.placed{position:absolute;z-index:3;font-size:2.8rem;cursor:pointer}.wardrobe{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.wardrobe button{border:3px solid #eadcf3;border-radius:14px;padding:12px;background:#fff8fd;font-weight:900}.townpicture{height:180px;border-radius:18px;background:url('assets/maple-moon-town.png') center/cover;margin-bottom:12px}.roompicture{background-position:left center}.schoolpicture{background-position:center top}.bakerypicture{background-position:center center}.petpicture{background-position:right center}.big{font-size:5rem}.result,.storyline{background:#fff5b8;border-radius:16px;padding:16px;font-weight:700;margin:14px 0;line-height:1.5}.footer{text-align:center;padding:28px;color:#795b8a}
</style>
<main class="wrap"><section class="hero"><h1>🌸 Little Game Garden 🌸</h1><p>Creative, cozy, friendship-friendly games for playing solo or with someone beside you.</p><div class="badges"><span class="badge">✨ no ads</span><span class="badge">🎨 make things</span><span class="badge">💬 talk & laugh</span><span class="badge">🌈 just for fun</span></div></section>
<div class="toolbar"><input id="search" class="search" placeholder="Search games: room, quiz, story…"><button class="filter active" data-f="all">All</button><button class="filter" data-f="creative">Creative</button><button class="filter" data-f="chat">Talk together</button><button class="filter" data-f="solo">Solo</button></div>
<section id="grid" class="grid"></section><section id="panel" class="panel"><button class="close" id="close">×</button><div id="area"></div></section><footer class="footer">Made for imagination, kindness, and the friend who says “one more round.” 💖</footer></main>
<script>
const games=[
['room','🏡','Dream Room Decorator','Build a room that feels completely you.','creative solo'],
['style','👗','Style Mood Mixer','Pick a color story, vibe, and finishing touch.','creative solo'],
['friend','💌','Bestie Question Jar','Pull low-pressure questions for laughs and stories.','chat'],
['story','📖','Pass-the-Story Garden','Take turns adding one line to a surprise adventure.','chat'],
['quiz','🌟','What Should We Do Today?','Answer five quick questions for a mini-plan.','chat solo'],
['pet','🐾','Pet Matchmaker','Choose a habitat and meet your imaginary pet.','solo'],
['craft','✂️','Craft Idea Generator','Spin supplies and vibes into a make-at-home idea.','creative solo'],
['would','🤔','Would You Rather: Cozy Edition','Silly, surprising choices for a sleepover.','chat'],
['secret','🔐','Secret Code Club','Make and decode a colorful secret message.','solo chat'],
['garden','🌷','Little Game Garden','Complete tiny quests to grow a flower.','solo chat'],
['playlist','🎧','Soundtrack Your Scene','Invent a pretend soundtrack for a moment.','solo chat'],
['draw','🖍️','Doodle Relay','Get drawing prompts to send to a friend.','creative chat'],
['memory','🧠','Flip & Find Memory','Match pairs of cheerful icons in a quick memory game.','solo chat'],
['charades','🎭','Emoji Charades','Act out an emoji clue while a friend guesses.','chat'],
['cafe','🧁','Pet Café Designer','Choose a menu, theme, and mascot for your dream café.','creative solo'],
['trivia','💡','Tiny Trivia Pop','Answer friendly questions about animals, space, art, and fun facts.','solo chat'],
['sticker','🎀','Sticker Page Maker','Arrange a pretend sticker page and give it a theme.','creative solo'],
['adventure','🗺️','Friendship Quest','Choose kind, curious actions to reach the secret garden.','chat solo']];
games.push(['town','', 'Starwhisper City','A tiny story world with places to visit, outfits to choose, a pet to find, and missions to unlock.','creative solo chat']);
let filter='all',grid=document.querySelector('#grid'),panel=document.querySelector('#panel'),area=document.querySelector('#area');
function render(){let q=document.querySelector('#search').value.toLowerCase();grid.innerHTML=games.filter(g=>(filter==='all'||g[4].includes(filter))&&(g[2]+g[3]).toLowerCase().includes(q)).map(g=>'<article class="card"><div class="game-art" role="img" aria-label="Maple Moon Town artwork"></div><div class="tag">'+g[4].replace(' ',' · ')+'</div><h3>'+g[2]+'</h3><p>'+g[3]+'</p><button class="play" onclick="openGame(\''+g[0]+'\&quot;)">Play now →</button></article>').join('')}
document.querySelector('#search').oninput=render;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});document.querySelector('#close').onclick=()=>{panel.classList.remove('show','fullscreen');document.body.style.overflow=''};
function show(t,s,b){area.innerHTML='<h2>'+t+'</h2><p>'+s+'</p>'+b;panel.classList.add('show','fullscreen');document.body.style.overflow='hidden'}
function openGame(k){({room,style,friend,story,quiz,pet,craft,would,secret,garden,playlist,draw,memory,charades,cafe,trivia,sticker,adventure,town:townWorld}[k])()}
function room(){show('🏡 Dream Room Decorator','Click an item to add it. Click an item in the room to remove it.','<div class="stage" id="rs"><div class="big">🛋️</div><p>Your room is ready!</p></div><div class="choicegrid">'+['🪟 window','🪴 plant','🌈 rainbow','⭐ stars','🧸 plushie','🛏️ bed','🕯️ lamp','🖼️ art'].map(x=>'<button class="choice" onclick="addRoom(\''+x.split(' ')[0]+'\&quot;)">'+x+'</button>').join('')+'</div><div id="rr" class="result">Add four things to unlock your room mood.</div>')}
function addRoom(x){let e=document.createElement('span');e.className='big';e.textContent=x;e.onclick=()=>e.remove();document.querySelector('#rs').append(e);let n=document.querySelectorAll('#rs .big').length;document.querySelector('#rr').textContent=n>=4?'✨ Your room mood: magical, cozy, and totally yours!':'Add '+(4-n)+' more decoration'+(n===3?'':'s')+'!'}
function style(){show('👗 Style Mood Mixer','Pick one from each row; there is no wrong answer.','<div id="sc">'+[['Color story',['pink + orange','blue + green','purple + yellow','every color']],['Vibe',['cozy','sporty','dreamy','bold']],['Finishing touch',['hair bow','sparkly socks','sticker nails','favorite hoodie']]].map(r=>'<h3>'+r[0]+'</h3><div class="choicegrid">'+r[1].map(x=>'<button class="choice" onclick="pick(this)">'+x+'</button>').join('')+'</div>').join('')+'</div><div id="sr" class="result">Choose one in every row!</div>')}
function pick(b){b.parentNode.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');let a=[...document.querySelectorAll('#sc .selected')];if(a.length===3)document.querySelector('#sr').textContent='Your mood board: '+a.map(x=>x.textContent).join(' · ')+' ✨'}
const prompts=['What made you smile lately?','If our friendship had a mascot, what would it be?','What would your perfect free afternoon include?','What snack could you eat twice?','Where would you love to explore?','What makes a day extra cozy?','What talent would you try?','What is your funniest harmless habit?'];
function friend(){show('💌 Bestie Question Jar','Take turns answering or use it as a journal game.','<div class="stage"><div class="big">🫙</div><div id="pr" class="storyline">Tap the button for a question!</div></div><button class="primary" onclick="newPrompt()">Pull a question</button>')}function newPrompt(){document.querySelector('#pr').textContent=prompts[Math.floor(Math.random()*prompts.length)]}
function story(){let lines=[];let p=['You discover a tiny door in a flowerpot.','A friendly cloud offers you a map.','The garden path begins to glow.','A mysterious cat knows one secret.','You find a key made of moonlight.'];show('📖 Pass-the-Story Garden','Take turns: each player adds one sentence, then tap a twist.','<div id="sl" class="storyline">Once upon a time, two friends found a hidden garden…</div><div class="choicegrid">'+p.map(x=>'<button class="choice" onclick="addLine(\''+x+'\&quot;)">'+x+'</button>').join('')+'</div><button class="primary" onclick="finishLine()">Finish our story</button>')}function addLine(x){document.querySelector('#sl').textContent+=' '+x}function finishLine(){document.querySelector('#sl').textContent+=' And they laughed all the way home. The end! 💖'}
function quiz(){let q=['What sounds best?','Pick a vibe','Choose a teammate','Pick a tiny treat','Finish with a word'],a=[],opts=[['a cozy craft','a silly challenge','a mini adventure','a deep chat'],['sunny & bright','soft & cozy','bold & colorful','calm & nature'],['my best friend','a cousin','my sibling','my future self'],['music break','snack break','drawing break','dance break'],['joy','curious','brave','kind']],i=0;function step(){if(i===5){show('🌟 Your mini-plan is ready!','You answered with your own style.','<div class="result">Plan: '+a[0]+', with a '+a[1]+' vibe, invite '+a[2]+', take a '+a[3]+', and keep it '+a[4]+'. ✨</div>');return}show('🌟 What Should We Do Today?','Question '+(i+1)+' of 5: '+q[i],'<div class="choicegrid">'+opts[i].map(x=>'<button class="choice" onclick="qa(\''+x+'\&quot;)">'+x+'</button>').join('')+'</div>')}window.qa=x=>{a.push(x);i++;step()};step()}
function pet(){show('🐾 Pet Matchmaker','Choose a habitat to meet your imaginary pet.','<div class="choicegrid">'+['cloud castle','moonlit forest','coral palace','cozy bookshelf'].map(x=>'<button class="choice" onclick="petDone()">'+x+'</button>').join('')+'</div><div id="pet" class="result">Your pet is waiting…</div>')}function petDone(){document.querySelector('#pet').textContent='You found a Sparklefox! Give it a snack, a superpower, and your own name. 🐾'}
function craft(){let a=['paper flowers','markers','yarn bracelets','collage cards','decorated bookmarks','kindness notes'],b=['rainbow','nature','cozy','sparkly','animal','friendship'];show('✂️ Craft Idea Generator','Tap the spinner for a make-at-home idea.','<div class="stage"><div class="big">🎨</div><div id="cr" class="storyline">Your next project will appear here.</div></div><button class="primary" onclick="spin()">Spin an idea</button>')}function spin(){let a=['paper flowers','markers','yarn bracelets','collage cards','decorated bookmarks','kindness notes'],b=['rainbow','nature','cozy','sparkly','animal','friendship'];document.querySelector('#cr').textContent='Make '+a[Math.floor(Math.random()*a.length)]+' with a '+b[Math.floor(Math.random()*b.length)]+' theme! Add your favorite colors and one surprise detail.'}
function would(){let d=[['Have a room with a secret passage','Have a treehouse with a slide'],['Always have perfect hair','Always have perfect outfits'],['Pause time','Teleport'],['Design a candy shop','Design a pet café']];let i=0;function n(){let x=d[i++%d.length];show('🤔 Would You Rather?','There is no wrong answer—just interesting choices.','<div class="choicegrid"><button class="choice" onclick="n()">'+x[0]+'</button><button class="choice" onclick="n()">'+x[1]+'</button></div>')}n()}
function secret(){show('🔐 Secret Code Club','Write a message using the key, then ask a friend to decode it.','<div class="stage">A=🌸 B=⭐ C=🌙 D=💧 E=🌈 F=🍀 G=🎀 H=☀️ I=🍓 J=🦋 K=🐚 L=🌼 M=🍉 N=🎵 O=🧁 P=🐾 R=🌹 S=🌟 T=🍄 U=🦄 Y=💜</div><input id="si" class="search" placeholder="Type a short message"><button class="primary" onclick="encode()">Encode it</button><div id="co" class="result"></div>')}function encode(){let k={A:'🌸',B:'⭐',C:'🌙',D:'💧',E:'🌈',F:'🍀',G:'🎀',H:'☀️',I:'🍓',J:'🦋',K:'🐚',L:'🌼',M:'🍉',N:'🎵',O:'🧁',P:'🐾',R:'🌹',S:'🌟',T:'🍄',U:'🦄',Y:'💜',' ':' / '};document.querySelector('#co').textContent=[...document.querySelector('#si').value.toUpperCase()].map(x=>k[x]||x).join(' ')}
function garden(){let n=0;show('🌷 Little Game Garden','Complete tiny quests to grow your flower.','<div class="stage"><div class="big" id="fl">🌱</div><div id="q" class="storyline">Quest: say one kind thing about someone.</div></div><button class="primary" onclick="quest()">I did it!</button>')}function quest(){let n=++window.gn||1;document.querySelector('#fl').textContent=['🌱','🌿','🌷','🌻','💐'][Math.min(n,4)];document.querySelector('#q').textContent=n<4?'Quest complete! Now: '+['draw for five minutes','learn one new fact','make someone laugh'][n-1]:'Your garden is blooming! You grew kindness. 🌼'}
function playlist(){let a=['a rainy-window drawing session','a best-friend walk','a getting-ready dance party','a sunset snack picnic'];show('🎧 Soundtrack Your Scene','Pick a scene and invent its song title.','<div class="choicegrid">'+a.map(x=>'<button class="choice" onclick="document.querySelector(\'#pl\').textContent=\'Try a dreamy pop soundtrack for '+x+'.\'">'+x+'</button>').join('')+'</div><div id="pl" class="result">Choose a scene!</div>')}
function draw(){let p=['a tiny pet with a huge hat','your dream bedroom window','a snack with a personality','a magical school bag','a garden full of surprises','a new emoji'];show('🖍️ Doodle Relay','Draw one, then send the next prompt to a friend.','<div class="stage"><div class="big">🖍️</div><div id="dp" class="storyline">Tap for a prompt.</div></div><button class="primary" onclick="document.querySelector(\'#dp\').textContent=p[Math.floor(Math.random()*p.length)]">Give me a prompt</button>')}
function memory(){let icons=['🌸','⭐','🐰','🍓','🌈','🦄'];let deck=[...icons,...icons].sort(()=>Math.random()-.5),open=[],matched=0;show('🧠 Flip & Find Memory','Tap two cards. Match all six pairs with as few tries as you can.',`<div id="mem" class="choicegrid">${deck.map((x,i)=>`<button class="choice" id="m${i}" onclick="flipCard(${i})">❔</button>`).join('')}</div><div id="memresult" class="result">Pairs: 0 / 6</div>`);window.flipCard=i=>{if(open.includes(i)||document.querySelector('#m'+i).disabled)return;document.querySelector('#m'+i).textContent=deck[i];open.push(i);if(open.length===2){let[a,b]=open;if(deck[a]===deck[b]){document.querySelector('#m'+a).disabled=true;document.querySelector('#m'+b).disabled=true;matched++;document.querySelector('#memresult').textContent='Pairs: '+matched+' / 6';if(matched===6)document.querySelector('#memresult').textContent='You found every pair! Amazing memory! 🎉';open=[]}else setTimeout(()=>{document.querySelector('#m'+a).textContent='❔';document.querySelector('#m'+b).textContent='❔';open=[]},650)}}}
function charades(){let p=['a sleepy kitten','a superhero landing','a robot making pancakes','a butterfly finding a flower','a penguin at a dance party','a wizard losing a sock'];show('🎭 Emoji Charades','Show the clue with your face and body—no words! Give your friend 30 seconds to guess.',`<div class="stage"><div class="big">🎭</div><div id="ch" class="storyline">Tap for your secret clue.</div></div><button class="primary" onclick="document.querySelector('#ch').textContent=p[Math.floor(Math.random()*p.length)]">Reveal a clue</button>`)}
function cafe(){let choices=['Rainbow Sprinkle Café','Moonlight Cocoa Café','Garden Berry Café','Cloud Nine Cupcakes'];show('🧁 Pet Café Designer','Pick a café theme, then invent one menu item and a mascot name.',`<div class="choicegrid">${choices.map(x=>`<button class="choice" onclick="document.querySelector('#caferesult').textContent='Your café: ${x}. Menu idea: '+['strawberry cloud toast','sparkle lemonade','tiny rainbow cakes','cozy cocoa cups'][Math.floor(Math.random()*4)]+'! Now name your mascot.'">${x}</button>`).join('')}</div><div id="caferesult" class="result">Choose a theme!</div>`)}
function trivia(){let data=[['Which planet is famous for its rings?',['Saturn','Mars','Venus'],0],['What do bees make?',['Honey','Popcorn','Lemonade'],0],['How many legs does a spider have?',['Six','Eight','Ten'],1],['What is a baby frog called?',['Tadpole','Pup','Chick'],0]];let i=0,score=0;function next(){if(i===data.length){show('💡 Tiny Trivia Pop','You finished the round!',`<div class="result">Score: ${score} / ${data.length} ⭐</div><button class="primary" onclick="trivia()">Play again</button>`);return}let q=data[i];show('💡 Tiny Trivia Pop','Question '+(i+1)+' of '+data.length+': '+q[0],`<div class="choicegrid">${q[1].map((x,j)=>`<button class="choice" onclick="answerTrivia(${j})">${x}</button>`).join('')}</div>`)}window.answerTrivia=j=>{if(j===data[i][2])score++;i++;next()};next()}
function sticker(){let themes=['Best Friend Day','Cozy Reading Club','Rainbow Summer','Pet Party','Dreamy Night'];let stickers=['💖','⭐','🌈','🐱','🧁','🌸','🦋','🎀'];show('🎀 Sticker Page Maker','Pick a theme, then tap stickers to fill your page.',`<div class="stage" id="stickerstage"><h2>My Sticker Page</h2><p>Choose a theme below!</p></div><div class="choicegrid">${themes.map(x=>`<button class="choice" onclick="document.querySelector('#stickerstage h2').textContent='${x}'">${x}</button>`).join('')}</div><div class="choicegrid">${stickers.map(x=>`<button class="choice" onclick="addSticker('${x}&quot;)">${x} add</button>`).join('')}</div>`);window.addSticker=x=>{let e=document.createElement('span');e.className='big';e.textContent=x;e.style.margin='5px';document.querySelector('#stickerstage').append(e)}}
function adventure(){let steps=[['A little door opens. Do you…',['knock kindly','look for a clue']],['A cloud gives you a map. Do you…',['thank it','ask where it goes']],['You reach the garden. Do you…',['help the lost bird','follow the sparkles']]];let i=0;function next(){if(i===steps.length){show('🗺️ Friendship Quest','You made it!',`<div class="result">You reached the secret garden by being curious and kind. 🌷</div>`);return}let q=steps[i++];show('🗺️ Friendship Quest',q[0],`<div class="choicegrid">${q[1].map(x=>`<button class="choice" onclick="next()">${x}</button>`).join('')}</div>`)}next()}
function townWorld(){
  window.world={x:42,place:'Town Square',pet:false,coins:0};
  function draw(){show('Starwhisper City','Move your character, visit places, and choose what happens next.',`<div class="worldstage"><div class="worldlabel" id="placeLabel">${world.place}</div><img class="avatar" id="avatar" src="assets/starwhisper-character.png" alt="Your Starwhisper City character"></div><div class="worldpad"><span></span><button onclick="moveAvatar(0,-1)">Up</button><span></span><button onclick="moveAvatar(-1,0)">Left</button><button onclick="moveAvatar(0,1)">Down</button><button onclick="moveAvatar(1,0)">Right</button></div><div class="choicegrid"><button class="choice" onclick="worldPlace('Bedroom Studio&quot;)">Enter bedroom</button><button class="choice" onclick="worldPlace('Star Academy&quot;)">Visit school</button><button class="choice" onclick="worldPlace('Moonbeam Bakery&quot;)">Visit bakery</button><button class="choice" onclick="worldPlace('Pet Park&quot;)">Visit pet park</button></div><div class="result" id="worldResult">Coins: ${world.coins} · Your pet: ${world.pet?'Clover':'not adopted yet'}</div>`)}
  window.moveAvatar=(dx,dy)=>{world.x=Math.max(8,Math.min(84,world.x+dx*7));let a=document.querySelector('#avatar');a.style.left=world.x+'%';a.classList.toggle('walk',dx<0);document.querySelector('#placeLabel').textContent='Walking through Starwhisper City';};
  window.worldPlace=(name)=>{world.place=name;world.coins+=2;if(name==='Pet Park')world.pet=true;document.querySelector('#placeLabel').textContent=name;document.querySelector('#worldResult').textContent=name==='Pet Park'?'You met Clover. Tap Visit Pet Park again to adopt her.':'You explored '+name+'. You found 2 coins.';};draw();
}
function townBedroom(){show('Bedroom studio','Tap an item to decorate your new room. Then choose a look for your character.',`<div class="stage"><div class="townpicture roompicture"></div><p id="roomnote">The room is empty and ready for your ideas.</p></div><div class="choicegrid"><button class="choice" onclick="townState.room++;document.querySelector('#roomnote').textContent='A soft reading corner is ready.'">Add reading corner</button><button class="choice" onclick="townState.room++;document.querySelector('#roomnote').textContent='Your wall has a new color story.'">Change wall colors</button><button class="choice" onclick="townState.room++;document.querySelector('#roomnote').textContent='A display shelf is holding your favorite things.'">Add display shelf</button></div><h3>Choose a character look</h3><div class="choicegrid"><button class="choice" onclick="townState.look='Lavender jacket';townState.missions++;townBedroom()">Lavender jacket</button><button class="choice" onclick="townState.look='Sunset outfit';townState.missions++;townBedroom()">Sunset outfit</button><button class="choice" onclick="townState.look='Comfy school look';townState.missions++;townBedroom()">Comfy school look</button></div><button class="primary" onclick="townMap()">Back to city map</button>`)}
function townSchool(){show('Star Academy','Your first school-day mission is ready.',`<div class="stage"><div class="townpicture schoolpicture"></div><p id="schoolnote">Pack one useful thing and one kind note.</p></div><div class="choicegrid"><button class="choice" onclick="townState.missions++;townState.coins+=5;document.querySelector('#schoolnote').textContent='You packed a notebook and wrote a kind note. Mission complete.'">Pack my bag</button><button class="choice" onclick="townState.missions++;townState.coins+=5;document.querySelector('#schoolnote').textContent='You helped a new student find the art room. Mission complete.'">Help a new student</button></div><button class="primary" onclick="townMap()">Back to city map</button>`)}
function townBakery(){show('Moonbeam Bakery','Design the bakery order for the town picnic.',`<div class="stage"><div class="townpicture bakerypicture"></div><p id="bakerynote">The counter is ready for your design.</p></div><div class="choicegrid"><button class="choice" onclick="townState.coins+=3;document.querySelector('#bakerynote').textContent='You made a berry cake with star-shaped sugar.'">Berry cake</button><button class="choice" onclick="townState.coins+=3;document.querySelector('#bakerynote').textContent='You made a warm cocoa with a cloud of whipped cream.'">Cloud cocoa</button><button class="choice" onclick="townState.coins+=3;document.querySelector('#bakerynote').textContent='You made a rainbow fruit tart.'">Fruit tart</button></div><button class="primary" onclick="townMap()">Back to city map</button>`)}
function townPets(){show('Pet Park','A small animal is waiting for a careful, kind new friend.',`<div class="stage"><div class="townpicture petpicture"></div><p id="petnote">Meet the animals and choose how to help.</p></div><div class="choicegrid"><button class="choice" onclick="townState.pet=true;townState.missions++;document.querySelector('#petnote').textContent='You adopted Clover, a gentle park rabbit.'">Adopt Clover</button><button class="choice" onclick="townState.coins+=2;document.querySelector('#petnote').textContent='You filled the water bowls for every animal.'">Fill water bowls</button><button class="choice" onclick="townState.coins+=2;document.querySelector('#petnote').textContent='You made a quiet toy for the shy kitten.'">Make a pet toy</button></div><button class="primary" onclick="townMap()">Back to city map</button>`)}
function townWorld(){
  window.world={x:42,place:'Town square',coins:0,pet:false,look:'Original look'};
  function screen(mode){
    let body='';
    if(mode==='town') body='<div class="worldstage"><div class="worldlabel" id="worldplace">Town square</div><img class="avatar" id="avatar" src="assets/starwhisper-character.png" alt="Your character"><span class="placed" style="left:18%;bottom:18%">Welcome sign</span></div><div class="worldpad"><span></span><button onclick="walk(0,-1)">Up</button><span></span><button onclick="walk(-1,0)">Left</button><button onclick="walk(0,1)">Down</button><button onclick="walk(1,0)">Right</button></div><div class="choicegrid"><button class="choice" onclick="visit(&quot;Bedroom studio&quot;)">Enter bedroom</button><button class="choice" onclick="visit(&quot;Star Academy&quot;)">Visit school</button><button class="choice" onclick="visit(&quot;Moonbeam Bakery&quot;)">Visit bakery</button><button class="choice" onclick="visit(&quot;Pet Park&quot;)">Visit pet park</button></div>';
    if(mode==='room') body='<div class="worldstage" id="roomstage"><div class="worldlabel">Bedroom studio</div><img class="avatar" src="assets/starwhisper-character.png" alt="Your character"><span class="placed" style="left:12%;bottom:16%">Bed</span><span class="placed" style="left:72%;bottom:18%">Desk</span></div><p>Tap an item to place it in your room. Tap a placed item to remove it.</p><div class="wardrobe"><button onclick="placeItem(&quot;Reading corner&quot;)">Reading corner</button><button onclick="placeItem(&quot;Plant&quot;)">Plant</button><button onclick="placeItem(&quot;Wall art&quot;)">Wall art</button><button onclick="placeItem(&quot;Pet bed&quot;)">Pet bed</button></div>';
    if(mode==='wardrobe') body='<div class="stage"><img class="avatar" style="position:relative;left:auto;bottom:auto;width:150px" src="assets/starwhisper-character.png" alt="Your character"></div><h3>Choose a look</h3><div class="wardrobe"><button onclick="chooseLook(\'Lavender jacket\&quot;)">Lavender jacket</button><button onclick="chooseLook(\'Sunset outfit\&quot;)">Sunset outfit</button><button onclick="chooseLook(\'Comfy school look\&quot;)">Comfy school look</button><button onclick="chooseLook(\'Party colors\&quot;)">Party colors</button></div><div class="result" id="lookresult">Current look: ${world.look}</div>';
    if(mode==='pet') body='<div class="worldstage"><div class="worldlabel">Pet Park</div><span class="placed" style="left:35%;bottom:22%">Clover the rabbit</span><img class="avatar" style="left:62%" src="assets/starwhisper-character.png" alt="Your character"></div><div class="choicegrid"><button class="choice" onclick="adoptPet()">Adopt Clover</button><button class="choice" onclick="petTask()">Fill the water bowls</button><button class="choice" onclick="petTask()">Make a quiet toy</button></div><div class="result" id="petresult">A gentle pet is waiting for you.</div>';
    show('Starwhisper City','A small original story world. Explore, decorate, and make choices.',`<div class="worldtabs"><button onclick="screen('town&quot;)">Town map</button><button onclick="screen('room&quot;)">Bedroom</button><button onclick="screen('wardrobe&quot;)">Wardrobe</button><button onclick="screen('pet&quot;)">Pet park</button></div>${body}<div class="result">Coins: ${world.coins} · Pet: ${world.pet?'Clover':'not adopted'} · Look: ${world.look}</div>`);
  }
  window.walk=(dx,dy)=>{world.x=Math.max(8,Math.min(84,world.x+dx*7));let a=document.querySelector('#avatar');if(a){a.style.left=world.x+'%';a.classList.toggle('walk',dx<0)}let p=document.querySelector('#worldplace');if(p)p.textContent='Walking through town';};
  window.visit=name=>{world.place=name;world.coins+=2;screen('town');document.querySelector('#worldplace').textContent=name+' discovered';};
  window.placeItem=name=>{let s=document.querySelector('#roomstage'),e=document.createElement('span');e.className='placed';e.textContent=name;e.style.left=(15+Math.random()*70)+'%';e.style.bottom=(18+Math.random()*35)+'%';e.onclick=()=>e.remove();s.append(e)};
  window.chooseLook=x=>{world.look=x;screen('wardrobe')};window.adoptPet=()=>{world.pet=true;screen('pet');document.querySelector('#petresult').textContent='Clover is now your pet. She follows you around town.'};window.petTask=()=>{world.coins+=2;document.querySelector('#petresult').textContent='You helped the animals. You earned 2 coins.'};screen('town');
}
render();
</script></html>
